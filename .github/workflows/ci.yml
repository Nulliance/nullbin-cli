name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.4"
  STATICCHECK_VERSION: "v0.8.2"
  GOVULNCHECK_VERSION: "v1.9.0"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  NULLBIN_SERVER_SHA: "00e7fa13e980d1bd0805b4acfe9cb83b1b5b962e"

jobs:
  go:
    name: Go (fmt, vet, staticcheck, test -race, fuzz, govulncheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Check tracked files for Trojan Source bidi characters
        run: |
          python3 - <<'PY'
          import subprocess, sys
          bidi = set(range(0x202A, 0x202F)) | set(range(0x2066, 0x206A)) | {0x061C, 0x200E, 0x200F}
          files = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\x00")
          bad = []
          for raw in files:
              if not raw:
                  continue
              path = raw.decode("utf-8", "surrogateescape")
              with open(path, "rb") as f:
                  data = f.read()
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              for idx, ch in enumerate(text):
                  if ord(ch) in bidi:
                      bad.append(f"{path}: offset {idx}: U+{ord(ch):04X}")
                      break
          if bad:
              print("Raw bidirectional control characters detected:\n" + "\n".join(bad), file=sys.stderr)
              sys.exit(1)
          PY
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}" ./...
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: Fuzz parsers and sanitizers (short run per target)
        run: |
          for f in FuzzParsePrefix FuzzDecodeBlob FuzzSanitizeFilename; do
            go test -run='^$' -fuzz="^${f}\$" -fuzztime=15s ./format
          done
          go test -run='^$' -fuzz='^FuzzParseLink$' -fuzztime=15s ./link
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  test-cross-os:
    name: Go test -race (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: go test -race
        run: go test -race -count=1 ./...

  interop-e2e:
    name: E2E interop (Go CLI <-> real nullbin-server <-> JS/libsodium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cli
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Nulliance/nullbin-server
          ref: ${{ env.NULLBIN_SERVER_SHA }}
          path: server
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: server/.nvmrc
          package-manager-cache: false
      - name: Install nullbin-server JS dependencies
        working-directory: server
        run: npm ci --ignore-scripts
      - name: Build real nullbin API server and nullbin-cli
        run: |
          (cd server && CGO_ENABLED=0 go build -tags=api -trimpath -o "$RUNNER_TEMP/nullbin-server" ./cmd/nullbin)
          (cd cli && CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/nullbin-cli" ./cmd/nullbin-cli)
      - name: Run bidirectional E2E interop suite
        run: node cli/scripts/e2e_interop.mjs "$RUNNER_TEMP/nullbin-cli" "$GITHUB_WORKSPACE/server" "$RUNNER_TEMP/nullbin-server"

  reproducible:
    name: Reproducible cross-platform build check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build twice from separate clean directories and compare SHA-256
        run: |
          mkdir -p "$RUNNER_TEMP/src-a" "$RUNNER_TEMP/src-b" "$RUNNER_TEMP/out-a" "$RUNNER_TEMP/out-b"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/src-a"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/src-b"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            name="nullbin-cli-${os}-${arch}${ext}"
            (cd "$RUNNER_TEMP/src-a" && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOTOOLCHAIN=local \
              go build -trimpath -buildvcs=false -ldflags="-s -w -buildid= -X main.version=repro" \
              -o "$RUNNER_TEMP/out-a/${name}" ./cmd/nullbin-cli)
            (cd "$RUNNER_TEMP/src-b" && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOTOOLCHAIN=local \
              go build -trimpath -buildvcs=false -ldflags="-s -w -buildid= -X main.version=repro" \
              -o "$RUNNER_TEMP/out-b/${name}" ./cmd/nullbin-cli)
          done
          (cd "$RUNNER_TEMP/out-a" && sha256sum *) | tee "$RUNNER_TEMP/a.sha256"
          (cd "$RUNNER_TEMP/out-b" && sha256sum *) > "$RUNNER_TEMP/b.sha256"
          diff "$RUNNER_TEMP/a.sha256" "$RUNNER_TEMP/b.sha256"

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full git history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --exit-code 1 .'
