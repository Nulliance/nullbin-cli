name: Release

# Triggered manually by a maintainer from main. Builds reproducible
# cross-platform binaries twice, verifies byte-for-byte identity, creates a
# keyless Sigstore-signed Git tag (Gitsign), signs SHA256SUMS with Cosign
# keyless OIDC, and publishes the GitHub release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  GO_VERSION: "1.27.4"

jobs:
  build:
    name: Build and verify reproducibility (read-only)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Validate release request
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Run releases from main only."; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad tag: $TAG"; exit 1; }
      - name: Require commit on main with passing CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "The selected commit must be on main."; exit 1; }
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" -q '[.workflow_runs[] | select(.conclusion == "success")] | length')
          [[ "$passed" -gt 0 ]] || { echo "CI has not passed on main for this commit."; exit 1; }
      - name: Build cross-platform binaries twice and verify reproducibility
        run: |
          mkdir -p "$RUNNER_TEMP/src-a" "$RUNNER_TEMP/src-b" "$RUNNER_TEMP/dist-a" "$RUNNER_TEMP/dist-b"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/src-a"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/src-b"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            name="nullbin-cli-${os}-${arch}${ext}"
            (cd "$RUNNER_TEMP/src-a" && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOTOOLCHAIN=local \
              go build -trimpath -buildvcs=false -ldflags="-s -w -buildid= -X main.version=${TAG}" \
              -o "$RUNNER_TEMP/dist-a/${name}" ./cmd/nullbin-cli)
            (cd "$RUNNER_TEMP/src-b" && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" GOTOOLCHAIN=local \
              go build -trimpath -buildvcs=false -ldflags="-s -w -buildid= -X main.version=${TAG}" \
              -o "$RUNNER_TEMP/dist-b/${name}" ./cmd/nullbin-cli)
          done
          (cd "$RUNNER_TEMP/dist-a" && sha256sum nullbin-cli-*) > "$RUNNER_TEMP/dist-a/SHA256SUMS"
          (cd "$RUNNER_TEMP/dist-b" && sha256sum nullbin-cli-*) > "$RUNNER_TEMP/dist-b/SHA256SUMS"
          diff "$RUNNER_TEMP/dist-a/SHA256SUMS" "$RUNNER_TEMP/dist-b/SHA256SUMS"
          cat "$RUNNER_TEMP/dist-a/SHA256SUMS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/dist-a/
          retention-days: 1

  release:
    name: Sign tag, sign SHA256SUMS, and publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: release-dist
      - name: Install pinned Gitsign and Cosign
        run: |
          go install github.com/sigstore/gitsign@v0.18.0
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.5.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Create and verify Sigstore-signed Git tag
        env:
          GITSIGN_TOKEN_PROVIDER: github-actions
        run: |
          identity="https://github.com/${GH_REPO}/.github/workflows/release.yml@refs/heads/main"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config gpg.x509.program "$(command -v gitsign)"
          git config gpg.format x509
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            [[ "$(git rev-parse "${TAG}^{commit}")" == "${GITHUB_SHA}" ]] || { echo "Existing tag points elsewhere."; exit 1; }
          else
            git tag -s "${TAG}" "${GITHUB_SHA}" -m "nullbin-cli ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi
          gitsign verify-tag \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-repository "${GH_REPO}" \
            --certificate-github-workflow-ref "refs/heads/main" \
            --certificate-github-workflow-trigger "workflow_dispatch" \
            "${TAG}"
      - name: Sign SHA256SUMS with Sigstore Cosign keyless bundle
        run: |
          cd release-dist
          if grep -qvE '^[0-9a-f]{64}  nullbin-cli-[a-z0-9-]+(\.exe)?$' SHA256SUMS; then
            echo "unexpected SHA256SUMS format"; exit 1
          fi
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GH_REPO}/.github/workflows/release.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            SHA256SUMS
      - name: Publish GitHub Release
        run: |
          {
            printf '## Reproducible Release (%s)\n\n' "$TAG"
            printf 'All binaries are built reproducibly (`CGO_ENABLED=0`, `-trimpath`, `-buildvcs=false`, `-ldflags="-s -w -buildid= -X main.version=%s"`) and verified by building twice from clean archives.\n\n' "$TAG"
            printf 'Verify `SHA256SUMS` with Sigstore Cosign:\n\n'
            printf '```bash\n'
            printf 'cosign verify-blob \\\n'
            printf '  --bundle SHA256SUMS.sigstore.json \\\n'
            printf '  --certificate-identity "https://github.com/%s/.github/workflows/release.yml@refs/heads/main" \\\n' "$GH_REPO"
            printf '  --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \\\n'
            printf '  SHA256SUMS\n'
            printf 'sha256sum -c --ignore-missing SHA256SUMS\n'
            printf '```\n\n'
            printf '```\n'
            cat release-dist/SHA256SUMS
            printf '```\n'
          } > notes.md
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --verify-tag "${prerelease[@]}" \
            --title "nullbin-cli $TAG" --notes-file notes.md \
            release-dist/nullbin-cli-* \
            release-dist/SHA256SUMS \
            release-dist/SHA256SUMS.sigstore.json
